<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- As the web's head: what Jonz is, the ground under each look, and
         installable, which is what lets an iPhone take reminders at all. The
         colours are Bin Night's backgrounds (a test keeps them equal). -->
    <meta name="description" content="Fair shares of the housework, and a house that keeps score." />
    <meta name="application-name" content="Jonz" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7e9e5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111315" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jonz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The card a pasted link shows in iMessage, WhatsApp, Slack and X. These
         are every page's; a join link's card names its house, and link-preview
         bots get it from apps/api (vercel.json sends them there). -->
    <meta property="og:site_name" content="Jonz" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jonz" />
    <meta property="og:description" content="Fair shares of the housework, and a house that keeps score." />
    <meta property="og:image" content="https://jonz.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jonz: fair shares of the housework." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Jonz needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
