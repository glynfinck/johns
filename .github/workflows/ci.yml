name: CI

# Vercel and Supabase deploy `main` (and `preview`) from their own GitHub
# integrations, so this workflow ships nothing. It is the proof: keep it a
# required status check, because a merge is the only thing that reaches a
# release branch and a deploy follows it unconditionally.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Read by supabase/config.toml; the suites never sign in with Google.
      AUTH_GOOGLE_CLIENT_ID: ci
      AUTH_GOOGLE_SECRET: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Pure rules first: the whole tier costs less than one `supabase start`.
      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Pinned, as in pub-golf: the CLI version decides what a fresh database
      # hands a table before any migration runs. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local Supabase
        run: |
          supabase start -x studio,edge-runtime,logflare,vector,imgproxy,mailpit,supavisor
          supabase db reset

      - name: Point the app at local Supabase
        run: |
          STATUS=$(supabase status -o json)
          API_URL=$(jq -r '.API_URL // empty' <<<"$STATUS")
          ANON=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' <<<"$STATUS")
          SERVICE=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' <<<"$STATUS")
          missing=""
          [ -n "$API_URL" ] || missing="$missing API_URL"
          [ -n "$ANON" ]    || missing="$missing ANON_KEY"
          [ -n "$SERVICE" ] || missing="$missing SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Supabase status is missing keys::$missing"
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3205"
            echo "CRON_SECRET=ci-tick-secret"
          } > .env.local

      # RLS is the only real enforcement, so the adversarial suites gate.
      - name: Database tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: End-to-end (phones and a laptop)
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
