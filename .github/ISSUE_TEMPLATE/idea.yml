name: An idea
description: Something Jonz could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's getting in the way
      description: What your house is trying to do, and where Jonz makes it hard.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: else
    attributes:
      label: Anything else
